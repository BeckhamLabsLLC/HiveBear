name: Mobile Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # See release.yml — compiled in, so source builds stay silent.
  HIVEBEAR_SENTRY_DSN: ${{ secrets.HIVEBEAR_SENTRY_DSN }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # rust-toolchain.toml pins the version, so the toolchain the action just
      # set up is not the one cargo will use. Add the targets to the pinned
      # toolchain as well, or the build fails with "can't find crate for
      # `core`". ci.yml already does this for the aarch64 cross-check; this
      # job never got the same treatment.
      - name: Add Android targets to the pinned toolchain
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      # v3.2.2 defaulted to installing the obsolete `tools` package, which
      # Google withdrew from the SDK repository; sdkmanager then exits 1 with
      # "Failed to find package 'tools'" and this job never got any further.
      # v4 defaults to platform-tools. Ask for exactly what the committed
      # Gradle project needs (compileSdk/targetSdk 36, AGP 8.11) plus the NDK
      # the Rust cross-build uses, so nothing is left to on-demand resolution.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006

      - name: Install frontend dependencies
        run: |
          cd apps/desktop
          npm install

      - name: Install tauri-cli
        # --force because the cargo cache restores ~/.cargo/bin, and a
        # second run then fails with "binary `cargo-tauri` already exists
        # in destination". That breaks every run following a successful
        # one, which is the worst possible cadence for a release job.
        run: cargo install tauri-cli@2.5.0 --locked --force

      # A release APK with no signing config comes out unsigned and will not
      # install. app/build.gradle.kts falls back to the debug key so the
      # artifact is always usable; supply these secrets to sign it properly
      # for distribution instead.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::notice title=Android signing::No ANDROID_KEYSTORE_BASE64 \
          secret set, so the release APK is signed with the debug key. It will \
          install for testing but is not suitable for distribution."
            exit 0
          fi
          cd apps/desktop/src-tauri/gen/android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          umask 077
          cat > keystore.properties <<PROPS
          storeFile=release.keystore
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          PROPS
          echo "Release keystore configured."

      - name: Build Android APK
        env:
          # llama-cpp-sys-2 finds the NDK through ANDROID_NDK, ANDROID_NDK_ROOT,
          # NDK_ROOT or CARGO_NDK_ANDROID_NDK — not NDK_HOME, which is all this
          # job used to set — and needs it to locate
          # build/cmake/android.toolchain.cmake for the cross build.
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          # app/build.gradle.kts declares minSdk 24, but the native code was
          # being compiled against API 35, which would fail to load on any
          # device below 35. Build the native side against 24 to match.
          ANDROID_PLATFORM: android-24
          CC_aarch64_linux_android: aarch64-linux-android24-clang
          CC_x86_64_linux_android: x86_64-linux-android24-clang
          AR_aarch64_linux_android: llvm-ar
          AR_x86_64_linux_android: llvm-ar
        run: |
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd apps/desktop
          # `tauri android build` (CLI 2.5) takes no trailing `--` args and has
          # no --no-default-features, which is what this step used to pass and
          # why it died with "unexpected argument '--no-default-features'".
          # It does not need them: candle is compiled out on Android by target
          # cfg, so the default feature set is already the right one.
          cargo tauri android build --apk --target aarch64 --target x86_64 \
            --features mobile

      - name: Upload APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: |
            apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  upload-android-assets:
    name: Upload Android Assets to Release
    permissions:
      contents: write
    needs: [build-android]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk
          path: artifacts

      - name: Collect APK assets
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          find artifacts -name "*.apk" -exec cp {} release/ \;
          cd release
          # Create stable-named copy for website download
          for f in *universal*.apk; do [ -f "$f" ] && cp "$f" HiveBear.apk; done
          sha256sum * > SHA256SUMS-android.txt

      - name: Upload Android assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG_NAME" release/* --repo "$REPO" --clobber
