name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Baked into the binary at compile time via option_env!. Only the release
  # builds get one, so anything built from source — by a contributor, by a
  # distro packager — physically cannot report, whatever the config says.
  HIVEBEAR_SENTRY_DSN: ${{ secrets.HIVEBEAR_SENTRY_DSN }}
  # Build-time secret, distinct from the DSN. Used by @sentry/vite-plugin to
  # upload the desktop webview's source maps; without it the plugin is skipped
  # and frontend stack traces stay minified.
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  # Fail in seconds, not after an hour of builds. A tag whose number differs
  # from the tree ships binaries that report the wrong version: Sentry files
  # their crashes under the wrong release, and the updater compares
  # latest.json against a number the app does not actually carry.
  preflight:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match Cargo.toml, tauri.conf.json and package.json
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${TAG_NAME#v}"
          cargo_v="$(awk '/^\[workspace\.package\]/{f=1} f && /^version[[:space:]]*=/{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)"
          tauri_v="$(python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')"
          npm_v="$(python3 -c 'import json; print(json.load(open("apps/desktop/package.json"))["version"])')"
          status=0
          for pair in "Cargo.toml [workspace.package]=$cargo_v" \
                      "apps/desktop/src-tauri/tauri.conf.json=$tauri_v" \
                      "apps/desktop/package.json=$npm_v"; do
            file="${pair%=*}"; found="${pair##*=}"
            if [ "$found" != "$tag" ]; then
              echo "::error file=${file%% *}::${file} says '${found}' but the tag is ${TAG_NAME}"
              status=1
            else
              echo "ok  ${file} = ${found}"
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Bump the versions (scripts/check-versions.sh lists every file), commit, and re-tag."
          fi
          exit "$status"

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries link against the build host's glibc, and only run
          # on systems with the same version or newer. ubuntu-latest (24.04,
          # glibc 2.39) produced a CLI that refused to start on Ubuntu 22.04
          # and Debian 12. 22.04 gives glibc 2.35. aarch64 builds natively on
          # GitHub's ubuntu-22.04-arm runner for the same reason: the cross
          # container (cross-rs :main) ships glibc 2.39, and v0.1.9's first
          # release run failed the glibc floor check on it.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: hivebear
            use_cross: false
            features: ""
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: hivebear
            use_cross: false
            features: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: hivebear
            use_cross: false
            features: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: hivebear
            use_cross: false
            features: "llamacpp-metal"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: hivebear.exe
            use_cross: false
            features: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross (aarch64-linux)
        if: matrix.use_cross
        run: cargo install cross@0.2.5 --locked

      - name: Add target
        if: "!matrix.use_cross"
        run: rustup target add ${{ matrix.target }}

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release -p hivebear-cli --target ${{ matrix.target }}

      - name: Build with cargo (default features)
        if: "!matrix.use_cross && matrix.features == ''"
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: cargo build --release -p hivebear-cli --target ${{ matrix.target }}

      - name: Build with cargo (extra features)
        if: "!matrix.use_cross && matrix.features != ''"
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: cargo build --release -p hivebear-cli --target ${{ matrix.target }} --features ${{ matrix.features }}

      # Guard the glibc floor, so moving a runner image cannot silently raise
      # it again. readelf reads any ELF, including the cross-built aarch64 one.
      - name: Check glibc floor (linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          need="$(readelf -V --wide "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)"
          echo "$bin requires glibc ${need}"
          if [ "$(printf '%s\n' "$need" 2.35 | sort -V | tail -1)" != "2.35" ]; then
            echo "::error::${bin} needs glibc ${need}, above the 2.35 floor (Ubuntu 22.04 / Debian 12). Was the runner image changed?"
            exit 1
          fi

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../hivebear-${{ matrix.target }}.tar.gz ${{ matrix.binary }}
          cd ../../..

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "hivebear-${{ matrix.target }}.zip"

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: hivebear-${{ matrix.target }}.tar.gz

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: hivebear-${{ matrix.target }}.zip

  build-desktop:
    name: Build Desktop (${{ matrix.platform }} ${{ matrix.arch }})
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for the same glibc floor as the CLI (see build-cli). An
          # AppImage bundles most libraries but not glibc.
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: ""
            bundle_dir: target/release/bundle
            artifact: desktop-linux
            tauri_features: ""
          # Apple Silicon: llama.cpp with Metal.
          - os: macos-latest
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
            bundle_dir: target/aarch64-apple-darwin/release/bundle
            artifact: desktop-macos-aarch64
            tauri_features: "llamacpp-metal"
          # Intel Macs: CPU llama.cpp. Built natively rather than
          # cross-compiled from the arm runner, so the bundle is exercised on
          # the architecture it ships for. macos-13 was the usual Intel label
          # but GitHub retired that image in December 2025; macos-15-intel is
          # the last Intel image (supported until August 2027). After that,
          # cross-compile from macos-latest with --target x86_64-apple-darwin,
          # the way build-cli already does for the CLI.
          - os: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            bundle_dir: target/x86_64-apple-darwin/release/bundle
            artifact: desktop-macos-x64
            tauri_features: ""
          - os: windows-latest
            platform: windows
            arch: x64
            target: ""
            bundle_dir: target/release/bundle
            tauri_features: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # rust-toolchain.toml pins the toolchain cargo actually uses, so the
      # target has to be added to that one, from inside the checkout.
      - name: Add target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # matrix.os, not runner.os: both macOS legs are runner.os == macOS,
          # and an arm64 cache restored onto the Intel runner is dead weight.
          key: ${{ matrix.os }}-desktop-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-desktop-cargo-

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: |
          cd apps/desktop
          npm install

      - name: Install tauri-cli
        # --force because the cargo cache restores ~/.cargo/bin, and a
        # second run then fails with "binary `cargo-tauri` already exists
        # in destination". That breaks every run following a successful
        # one, which is the worst possible cadence for a release job.
        run: cargo install tauri-cli@2.5.0 --locked --force

      # On macOS, tauri.conf.json sets bundle.macOS.signingIdentity to "-",
      # so Tauri ad-hoc signs the app before it builds the DMG and the updater
      # bundle. That costs nothing and needs no Apple account, and it is the
      # difference on Apple Silicon between "Open Anyway" in Privacy &
      # Security and a flat "HiveBear is damaged and can't be opened".
      - name: Build Tauri app
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.tauri_features }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          if [ -n "$FEATURES" ]; then args+=(-- --features "$FEATURES"); fi
          cd apps/desktop
          cargo tauri build "${args[@]}"

      # Both macOS legs emit the updater bundle as HiveBear.app.tar.gz, and
      # every asset in a release shares one flat namespace, so the second
      # upload would replace the first and one architecture would be served
      # the other's app. Give each a fixed, version-free name; latest.json and
      # install.sh --desktop both use these names.
      - name: Check signature and name the updater bundle (macOS)
        if: matrix.platform == 'macos'
        env:
          BUNDLE: ${{ matrix.bundle_dir }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app="$BUNDLE/macos/HiveBear.app"
          if ! codesign -dv "$app" 2>sig.txt; then
            cat sig.txt
            echo "::error::$app is not signed at all. Apple Silicon reports unsigned downloads as 'damaged' with no way to open them. Check bundle.macOS.signingIdentity is \"-\" in tauri.conf.json."
            exit 1
          fi
          cat sig.txt
          codesign --verify --deep --strict --verbose=2 "$app" \
            || echo "::warning::codesign --verify reported problems with $app (see above)"
          cd "$BUNDLE/macos"
          mv HiveBear.app.tar.gz "HiveBear_${ARCH}.app.tar.gz"
          mv HiveBear.app.tar.gz.sig "HiveBear_${ARCH}.app.tar.gz.sig"
          ls -l

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.bundle_dir }}/deb/*.deb
            ${{ matrix.bundle_dir }}/appimage/*.AppImage
            ${{ matrix.bundle_dir }}/appimage/*.AppImage.sig

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.bundle_dir }}/dmg/*.dmg
            ${{ matrix.bundle_dir }}/macos/*.app.tar.gz
            ${{ matrix.bundle_dir }}/macos/*.app.tar.gz.sig

      - name: Upload Windows MSI artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-msi
          path: |
            ${{ matrix.bundle_dir }}/msi/*.msi
            ${{ matrix.bundle_dir }}/msi/*.msi.sig

      - name: Upload Windows NSIS artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-nsis
          path: |
            ${{ matrix.bundle_dir }}/nsis/*.exe
            ${{ matrix.bundle_dir }}/nsis/*.exe.sig

  # The browser build that hivebear.com's playground loads. Built on every
  # tag so the site can pin a version and fetch it, instead of a copy someone
  # built by hand once and committed.
  build-wasm:
    name: Build WASM
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Add wasm32 target to the pinned toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: wasm-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-release-cargo-
            wasm-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack@0.13.1 --locked --force

      - name: Build
        run: wasm-pack build web --target web --release --out-name hivebear_web

      - name: Package
        run: |
          set -euo pipefail
          for f in hivebear_web.js hivebear_web_bg.wasm; do
            [ -f "web/pkg/$f" ] || { echo "::error::wasm-pack did not produce web/pkg/$f"; exit 1; }
          done
          tar czf hivebear-web-wasm.tar.gz -C web/pkg .
          sha256sum hivebear-web-wasm.tar.gz > hivebear-web-wasm.tar.gz.sha256
          tar tzf hivebear-web-wasm.tar.gz
          ls -l hivebear-web-wasm.tar.gz web/pkg/hivebear_web_bg.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm
          path: |
            hivebear-web-wasm.tar.gz
            hivebear-web-wasm.tar.gz.sha256

  verify-cargo-install:
    name: Verify cargo install
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-install-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-install-

      # Gate the release on the dependency versions we actually ship. The
      # release binaries are built from Cargo.lock, so an unlocked install
      # compiles a different set of crates than anything we publish.
      - name: cargo install from path (locked)
        run: cargo install --path crates/hivebear-cli --locked

      - name: Verify binary
        run: hivebear --version

      # The README's install command re-resolves everything, so upstream can
      # break it without a commit here. A fresh resolve currently moves ~279
      # packages. Report it, but do not hold the release hostage to it.
      - name: Check unlocked install (advisory)
        id: unlocked
        continue-on-error: true
        run: cargo install --path crates/hivebear-cli --force

      - name: Warn on dependency drift
        if: steps.unlocked.outcome != 'success'
        run: |
          echo "::warning title=Unlocked cargo install failed::\
          'cargo install' without --locked no longer compiles. Users who omit \
          --locked will hit this. Check which dependency changed API."

  create-release:
    name: Create GitHub Release
    permissions:
      contents: write
    needs: [build-cli, verify-cargo-install]
    # build-cli must succeed too. With only verify-cargo-install gating this,
    # a release could publish while a platform's tarball was missing — and
    # install.sh would then 404 for everyone on that platform, with no sign
    # anything was wrong until a user reported it.
    if: ${{ needs.build-cli.result == 'success' && needs.verify-cargo-install.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts/cli-* -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum -- * > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            release/*

  # NOTE: Tauri signs the installer for the updater, and SignPath re-signs the
  # same file for Windows SmartScreen. Authenticode signing rewrites the binary,
  # so the .sig produced above no longer verifies against it. If SignPath is
  # ever enabled (vars.SIGNPATH_ORG_ID), the updater signatures must be
  # regenerated from the signed installers, or every Windows update will be
  # rejected as corrupt.
  #
  # Windows builds ship unsigned unless SIGNPATH_ORG_ID is set. The whole job
  # is skipped in that case, rather than running and leaving the upload job to
  # discover the signed artifacts are missing: v0.1.8 logged "Artifact not
  # found: desktop-windows-nsis-signed" for a step that was never going to
  # produce anything, which read like a failure.
  sign-windows:
    name: Sign Windows Installers (SignPath)
    needs: [build-desktop]
    if: ${{ !cancelled() && needs.build-desktop.result == 'success' && vars.SIGNPATH_ORG_ID != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows MSI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-msi
          path: unsigned/msi

      - name: Download Windows NSIS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-nsis
          path: unsigned/nsis

      - name: Submit to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: hivebear
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installers
          input-artifact-path: unsigned/
          output-artifact-path: signed/
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 600

      - name: Upload signed MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-msi-signed
          path: signed/msi/

      - name: Upload signed NSIS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-nsis-signed
          path: signed/nsis/

  upload-desktop-assets:
    name: Upload Desktop Assets to Release
    permissions:
      contents: write
    needs: [create-release, build-desktop, sign-windows]
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Signed installers only exist when sign-windows ran and succeeded.
      # Otherwise (the normal case: no SignPath) take the unsigned ones, with
      # no failed step in the log on the way.
      - name: Download signed Windows MSI
        if: needs.sign-windows.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-msi-signed
          path: artifacts/desktop-windows-msi

      - name: Download signed Windows NSIS
        if: needs.sign-windows.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-nsis-signed
          path: artifacts/desktop-windows-nsis

      - name: Note signing fallback
        if: needs.sign-windows.result == 'failure'
        run: echo "::warning::SignPath signing failed; publishing the unsigned Windows installers instead."

      - name: Download unsigned Windows MSI
        if: needs.sign-windows.result != 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-msi
          path: artifacts/desktop-windows-msi

      - name: Download unsigned Windows NSIS
        if: needs.sign-windows.result != 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-nsis
          path: artifacts/desktop-windows-nsis

      - name: Download Linux desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-linux
          path: artifacts/desktop-linux

      - name: Download macOS desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-macos-*
          path: artifacts

      - name: Collect and rename desktop assets
        run: |
          set -euo pipefail
          mkdir -p release
          # Collect all desktop artifacts (installers + updater bundles + signatures)
          find artifacts/desktop-* -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.tar.gz" -o -name "*.nsis.zip" -o -name "*.sig" \) -exec cp {} release/ \;

          # Stable, version-free names for the website's download buttons
          # (releases/latest/download/<name>) and for install.sh/install.ps1.
          # HiveBear.dmg predates the Intel build and is linked from the site
          # and old posts, so it stays, as the Apple Silicon DMG.
          cd release
          for f in *_aarch64.dmg; do [ -f "$f" ] && cp "$f" HiveBear-arm64.dmg && cp "$f" HiveBear.dmg; done
          for f in *_x64.dmg; do [ -f "$f" ] && cp "$f" HiveBear-x64.dmg; done
          for f in *_x64_en-US.msi; do [ -f "$f" ] && cp "$f" HiveBear-x64.msi; done
          for f in *x64-setup.exe; do [ -f "$f" ] && cp "$f" HiveBear-x64-setup.exe; done
          for f in *_amd64.AppImage; do [ -f "$f" ] && cp "$f" HiveBear-x86_64.AppImage; done
          for f in *_amd64.deb; do [ -f "$f" ] && cp "$f" HiveBear-x86_64.deb; done

          # A missing stable name is a 404 on a download button, which nobody
          # reports; they just leave. Fail the job instead.
          missing=""
          for f in HiveBear.dmg HiveBear-arm64.dmg HiveBear-x64.dmg \
                   HiveBear_aarch64.app.tar.gz HiveBear_x64.app.tar.gz \
                   HiveBear-x64.msi HiveBear-x64-setup.exe \
                   HiveBear-x86_64.AppImage HiveBear-x86_64.deb; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            ls -l
            echo "::error::Missing desktop assets:${missing}"
            exit 1
          fi

          # Generate checksums for desktop assets
          sha256sum -- * > SHA256SUMS-desktop.txt

      - name: Generate updater manifest (latest.json)
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}"

          # Tauri 2 signs each bundle in place: HiveBear_x.y.z_amd64.AppImage
          # is signed as HiveBear_x.y.z_amd64.AppImage.sig. This job used to
          # look for .AppImage.tar.gz and .nsis.zip, which is Tauri 1 naming,
          # so nothing matched on Linux or Windows and only macOS ever reached
          # the manifest. Derive each filename from its own .sig so a signature
          # and the file it signs cannot drift apart again.
          emit() {
            for sig in $2; do
              [ -f "$sig" ] || continue
              printf '%s\t%s\t%s\n' "$1" "$(basename "${sig%.sig}")" "$(cat "$sig")"
              return 0
            done
            return 0
          }

          # The macOS updater bundles are renamed per architecture in
          # build-desktop, so each platform key has exactly one candidate.
          {
            emit linux-x86_64   'release/*.AppImage.sig'
            emit darwin-aarch64 'release/HiveBear_aarch64.app.tar.gz.sig'
            emit darwin-x86_64  'release/HiveBear_x64.app.tar.gz.sig'
            emit windows-x86_64 'release/*-setup.exe.sig'
          } > platforms.tsv

          python3 - "$VERSION" "$BASE_URL" <<'PYEOF'
          import datetime, json, sys

          version, base = sys.argv[1], sys.argv[2]
          platforms = {}
          with open("platforms.tsv") as fh:
              for line in fh:
                  if not line.strip():
                      continue
                  key, fname, sig = line.rstrip("\n").split("\t")
                  platforms[key] = {"signature": sig, "url": f"{base}/{fname}"}

          manifest = {
              "version": version,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
              "platforms": platforms,
          }
          with open("release/latest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(json.dumps(manifest, indent=2)[:2000])

          # Every platform here is built by this workflow, so a missing one
          # means its bundle or signature was not produced or not uploaded.
          # Shipping the manifest anyway freezes that platform's installs with
          # nothing to show for it, which is how v0.1.5 sat un-updatable for
          # six months. Fail instead.
          missing = sorted(
              {"linux-x86_64", "darwin-aarch64", "darwin-x86_64", "windows-x86_64"}
              - set(platforms)
          )
          if missing:
              sys.exit(
                  "latest.json is missing: " + ", ".join(missing) + ". Check that "
                  "bundle.createUpdaterArtifacts is set, that "
                  "TAURI_SIGNING_PRIVATE_KEY is present, and that the upload-artifact "
                  "globs match the filenames Tauri actually emitted."
              )
          PYEOF

      - name: Upload desktop assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG_NAME" release/* --repo "$REPO" --clobber

  upload-wasm:
    name: Upload WASM to Release
    permissions:
      contents: write
    needs: [create-release, build-wasm]
    if: ${{ !cancelled() && needs.create-release.result == 'success' && needs.build-wasm.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm
          path: wasm

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG_NAME" wasm/* --repo "$REPO" --clobber

  # Push the new version to the Homebrew tap and the Scoop bucket. Both are
  # separate repos, so GITHUB_TOKEN cannot write to them; this needs a PAT
  # (fine-grained, contents: write on both repos) in TAP_GITHUB_TOKEN. Without
  # it the job warns and does nothing, rather than failing the release.
  update-package-managers:
    name: Update Homebrew tap and Scoop bucket
    needs: [create-release]
    if: ${{ needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Decide whether to publish
        id: gate
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning title=Package managers not updated::TAP_GITHUB_TOKEN is not set, so BeckhamLabsLLC/homebrew-hivebear and BeckhamLabsLLC/scoop-hivebear still point at the previous release. Add the secret, or run scripts/update-homebrew-formula.sh $TAG_NAME and push the files by hand."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == *-* ]]; then
            echo "::notice::$TAG_NAME is a pre-release; leaving Homebrew and Scoop on the last stable version."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rendered from the release's own SHA256SUMS.txt, the same file
      # install.sh verifies against, by the same script maintainers run by hand.
      - name: Render formula and manifest
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/sums"
          SHA256SUMS_FILE="$RUNNER_TEMP/sums/SHA256SUMS.txt" scripts/update-homebrew-formula.sh "$TAG_NAME"
          cat packaging/homebrew/hivebear.rb packaging/scoop/hivebear.json

      - name: Push to tap and bucket
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish() {
            local repo="$1" src="$2" dest="$3" dir
            dir="$RUNNER_TEMP/$(basename "$repo")"
            git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${repo}.git" "$dir"
            mkdir -p "$(dirname "$dir/$dest")"
            cp "$src" "$dir/$dest"
            if git -C "$dir" diff --quiet -- "$dest" && [ -z "$(git -C "$dir" status --porcelain -- "$dest")" ]; then
              echo "$repo already has ${TAG_NAME#v}"
              return 0
            fi
            git -C "$dir" add -- "$dest"
            git -C "$dir" commit -m "hivebear ${TAG_NAME#v}"
            git -C "$dir" push origin HEAD
            echo "Updated $repo to ${TAG_NAME#v}"
          }

          publish BeckhamLabsLLC/homebrew-hivebear packaging/homebrew/hivebear.rb Formula/hivebear.rb
          publish BeckhamLabsLLC/scoop-hivebear packaging/scoop/hivebear.json bucket/hivebear.json
