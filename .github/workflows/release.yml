name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Baked into the binary at compile time via option_env!. Only the release
  # builds get one, so anything built from source — by a contributor, by a
  # distro packager — physically cannot report, whatever the config says.
  HIVEBEAR_SENTRY_DSN: ${{ secrets.HIVEBEAR_SENTRY_DSN }}
  # Build-time secret, distinct from the DSN. Used by @sentry/vite-plugin to
  # upload the desktop webview's source maps; without it the plugin is skipped
  # and frontend stack traces stay minified.
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: hivebear
            use_cross: false
            features: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: hivebear
            use_cross: true
            features: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: hivebear
            use_cross: false
            features: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: hivebear
            use_cross: false
            features: "llamacpp-metal"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: hivebear.exe
            use_cross: false
            features: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross (aarch64-linux)
        if: matrix.use_cross
        run: cargo install cross@0.2.5 --locked

      - name: Add target
        if: "!matrix.use_cross"
        run: rustup target add ${{ matrix.target }}

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release -p hivebear-cli --target ${{ matrix.target }}

      - name: Build with cargo (default features)
        if: "!matrix.use_cross && matrix.features == ''"
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: cargo build --release -p hivebear-cli --target ${{ matrix.target }}

      - name: Build with cargo (extra features)
        if: "!matrix.use_cross && matrix.features != ''"
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: cargo build --release -p hivebear-cli --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../hivebear-${{ matrix.target }}.tar.gz ${{ matrix.binary }}
          cd ../../..

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "hivebear-${{ matrix.target }}.zip"

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: hivebear-${{ matrix.target }}.tar.gz

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: hivebear-${{ matrix.target }}.zip

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            tauri_features: ""
          - os: macos-latest
            platform: macos
            tauri_features: "llamacpp-metal"
          - os: windows-latest
            platform: windows
            tauri_features: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-desktop-cargo-

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: |
          cd apps/desktop
          npm install

      - name: Install tauri-cli
        # --force because the cargo cache restores ~/.cargo/bin, and a
        # second run then fails with "binary `cargo-tauri` already exists
        # in destination". That breaks every run following a successful
        # one, which is the worst possible cadence for a release job.
        run: cargo install tauri-cli@2.5.0 --locked --force

      - name: Build Tauri app (default features)
        if: matrix.tauri_features == ''
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd apps/desktop
          cargo tauri build

      - name: Build Tauri app (extra features)
        if: matrix.tauri_features != ''
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd apps/desktop
          cargo tauri build -- --features ${{ matrix.tauri_features }}

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload Windows MSI artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-msi
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig

      - name: Upload Windows NSIS artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-nsis
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig

  verify-cargo-install:
    name: Verify cargo install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-install-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-install-

      # Gate the release on the dependency versions we actually ship. The
      # release binaries are built from Cargo.lock, so an unlocked install
      # compiles a different set of crates than anything we publish.
      - name: cargo install from path (locked)
        run: cargo install --path crates/hivebear-cli --locked

      - name: Verify binary
        run: hivebear --version

      # The README's install command re-resolves everything, so upstream can
      # break it without a commit here. A fresh resolve currently moves ~279
      # packages. Report it, but do not hold the release hostage to it.
      - name: Check unlocked install (advisory)
        id: unlocked
        continue-on-error: true
        run: cargo install --path crates/hivebear-cli --force

      - name: Warn on dependency drift
        if: steps.unlocked.outcome != 'success'
        run: |
          echo "::warning title=Unlocked cargo install failed::\
          'cargo install' without --locked no longer compiles. Users who omit \
          --locked will hit this. Check which dependency changed API."

  create-release:
    name: Create GitHub Release
    permissions:
      contents: write
    needs: [build-cli, verify-cargo-install]
    # build-cli must succeed too. With only verify-cargo-install gating this,
    # a release could publish while a platform's tarball was missing — and
    # install.sh would then 404 for everyone on that platform, with no sign
    # anything was wrong until a user reported it.
    if: ${{ needs.build-cli.result == 'success' && needs.verify-cargo-install.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts/cli-* -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            release/*

  # NOTE: Tauri signs the installer for the updater, and SignPath re-signs the
  # same file for Windows SmartScreen. Authenticode signing rewrites the binary,
  # so the .sig produced above no longer verifies against it. If SignPath is
  # ever enabled (vars.SIGNPATH_ORG_ID), the updater signatures must be
  # regenerated from the signed installers, or every Windows update will be
  # rejected as corrupt.
  sign-windows:
    name: Sign Windows Installers (SignPath)
    needs: [build-desktop]
    if: ${{ !cancelled() && needs.build-desktop.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows MSI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-msi
          path: unsigned/msi

      - name: Download Windows NSIS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-nsis
          path: unsigned/nsis

      - name: Submit to SignPath
        if: vars.SIGNPATH_ORG_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: hivebear
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installers
          input-artifact-path: unsigned/
          output-artifact-path: signed/
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 600

      - name: Upload signed MSI
        if: vars.SIGNPATH_ORG_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-msi-signed
          path: signed/msi/

      - name: Upload signed NSIS
        if: vars.SIGNPATH_ORG_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-nsis-signed
          path: signed/nsis/

  upload-desktop-assets:
    name: Upload Desktop Assets to Release
    permissions:
      contents: write
    needs: [create-release, build-desktop, sign-windows]
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Try signed Windows artifacts first, fall back to unsigned
      - name: Download signed Windows MSI
        id: signed-msi
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-msi-signed
          path: artifacts/desktop-windows-msi

      - name: Download signed Windows NSIS
        id: signed-nsis
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-nsis-signed
          path: artifacts/desktop-windows-nsis

      - name: Download unsigned Windows MSI (fallback)
        if: steps.signed-msi.outcome != 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-msi
          path: artifacts/desktop-windows-msi

      - name: Download unsigned Windows NSIS (fallback)
        if: steps.signed-nsis.outcome != 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-nsis
          path: artifacts/desktop-windows-nsis

      - name: Download Linux desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-linux
          path: artifacts/desktop-linux

      - name: Download macOS desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-macos
          path: artifacts/desktop-macos

      - name: Collect and rename desktop assets
        run: |
          mkdir -p release
          # Collect all desktop artifacts (installers + updater bundles + signatures)
          find artifacts/desktop-* -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.tar.gz" -o -name "*.nsis.zip" -o -name "*.sig" \) -exec cp {} release/ \;

          # Create stable-named copies for website download buttons
          cd release
          for f in *.dmg; do [ -f "$f" ] && cp "$f" HiveBear.dmg; done
          for f in *_x64_en-US.msi; do [ -f "$f" ] && cp "$f" HiveBear-x64.msi; done
          for f in *x64-setup.exe; do [ -f "$f" ] && cp "$f" HiveBear-x64-setup.exe; done
          for f in *_amd64.AppImage; do [ -f "$f" ] && cp "$f" HiveBear-x86_64.AppImage; done
          for f in *_amd64.deb; do [ -f "$f" ] && cp "$f" HiveBear-x86_64.deb; done

          # Generate checksums for desktop assets
          sha256sum * > SHA256SUMS-desktop.txt

      - name: Generate updater manifest (latest.json)
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}"

          # Tauri 2 signs each bundle in place: HiveBear_x.y.z_amd64.AppImage
          # is signed as HiveBear_x.y.z_amd64.AppImage.sig. This job used to
          # look for .AppImage.tar.gz and .nsis.zip, which is Tauri 1 naming,
          # so nothing matched on Linux or Windows and only macOS ever reached
          # the manifest. Derive each filename from its own .sig so a signature
          # and the file it signs cannot drift apart again.
          emit() {
            for sig in $2; do
              [ -f "$sig" ] || continue
              printf '%s\t%s\t%s\n' "$1" "$(basename "${sig%.sig}")" "$(cat "$sig")"
              return 0
            done
            return 0
          }

          {
            emit linux-x86_64   'release/*.AppImage.sig'
            emit darwin-aarch64 'release/*.app.tar.gz.sig'
            emit windows-x86_64 'release/*-setup.exe.sig'
          } > platforms.tsv

          python3 - "$VERSION" "$BASE_URL" <<'PYEOF'
          import datetime, json, sys

          version, base = sys.argv[1], sys.argv[2]
          platforms = {}
          with open("platforms.tsv") as fh:
              for line in fh:
                  if not line.strip():
                      continue
                  key, fname, sig = line.rstrip("\n").split("\t")
                  platforms[key] = {"signature": sig, "url": f"{base}/{fname}"}

          manifest = {
              "version": version,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
              "platforms": platforms,
          }
          with open("release/latest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(json.dumps(manifest, indent=2)[:2000])

          # Every platform here is built by this workflow, so a missing one
          # means its bundle or signature was not produced or not uploaded.
          # Shipping the manifest anyway freezes that platform's installs with
          # nothing to show for it, which is how v0.1.5 sat un-updatable for
          # six months. Fail instead.
          missing = sorted(
              {"linux-x86_64", "darwin-aarch64", "windows-x86_64"} - set(platforms)
          )
          if missing:
              sys.exit(
                  "latest.json is missing: " + ", ".join(missing) + ". Check that "
                  "bundle.createUpdaterArtifacts is set, that "
                  "TAURI_SIGNING_PRIVATE_KEY is present, and that the upload-artifact "
                  "globs match the filenames Tauri actually emitted."
              )
          PYEOF

      - name: Upload desktop assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG_NAME" release/* --repo "$REPO" --clobber
