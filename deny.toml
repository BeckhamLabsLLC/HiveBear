# cargo-deny configuration for HiveBear
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Reviewed 2026-08-11. Every entry below is an *unmaintained-crate* notice with no
# upgrade path, except the two quick-xml vulnerabilities noted at the end.
#
# All genuinely exploitable advisories found in this review were FIXED by upgrading,
# not ignored: RUSTSEC-2026-0185 (remote memory exhaustion in quinn-proto — our QUIC
# mesh transport), 2026-0098/0099/0104 (rustls-webpki), 2026-0204 (crossbeam-epoch)
# and 2026-0097 (rand unsoundness).
#
# The previous review's justifications were checked against the advisory DB and
# several were wrong (2024-0370 was labelled "bincode", it is proc-macro-error;
# 2024-0436 was labelled "fxhash", it is paste). Labels below are verified.
#
# Next review: 2026-11-11. Re-verify each ID against the DB — do not just move the date.
ignore = [
    # ── zip extraction advisories, on copies we cannot upgrade yet ──
    # zip 1.1 (candle-core 0.8) only reads .npz members by name and never calls
    # extract(). zip 4.6 (tauri-plugin-updater 2.10) only extracts the Windows
    # update archive after verify_signature() against our minisign pubkey, so
    # the archive is never attacker-controlled. self_update uses zip 9 (fixed).
    # Remove when candle >= 0.11 and tauri >= 2.12 / updater >= 2.14 land.
    "RUSTSEC-2026-0367",  # zip: SUID/SGID bits preserved on extract.
    "RUSTSEC-2026-0368",  # zip: extract() symlink targets escape destination.
    "RUSTSEC-2026-0369",  # zip: permissions applied through symlinks.
    "RUSTSEC-2026-0429",  # zip: extract() aborts on huge symlink entry.

    # ── Tauri v2 Linux/macOS build chain: unmaintained, compile-time only ──
    "RUSTSEC-2024-0370",  # proc-macro-error: unmaintained proc-macro helper.
    # (The gtk-rs GTK3 entries 2024-0411..0420 were dropped 2026-11: cargo deny
    # reports them as no longer matched.)
    "RUSTSEC-2024-0436",  # paste: unmaintained macro helper, reached via wgpu/metal.

    # ── Unmaintained leaf utilities, no known defect ──
    "RUSTSEC-2025-0057",  # fxhash: unmaintained hasher. No direct usage.
    "RUSTSEC-2025-0075",  # unic-char-range: unmaintained Unicode table crate.
    "RUSTSEC-2025-0080",  # unic-common: unmaintained.
    "RUSTSEC-2025-0081",  # unic-char-property: unmaintained.
    "RUSTSEC-2025-0098",  # unic-ucd-version: unmaintained.
    "RUSTSEC-2025-0100",  # unic-ucd-ident: unmaintained.
    "RUSTSEC-2025-0119",  # number_prefix: unmaintained byte-size formatter (indicatif).

    # ── bincode: unmaintained, and we use it directly for the mesh wire format ──
    # Not a known vulnerability, but this is the one entry here with real blast
    # radius if a defect is ever found. Track a migration off it.
    "RUSTSEC-2025-0141",  # bincode: unmaintained.

    # ── quick-xml DoS: real vulnerabilities, blocked by upstream semver pins ──
    # Fixed in 0.41.0, but self_update 0.42 pins ^0.37 and plist 1.8 (via Tauri)
    # pins ^0.38, so neither can take the fix without an upstream release.
    # Exposure is limited: quick-xml only parses GitHub release metadata over TLS
    # (self_update) and our own bundled Info.plist (plist) — no attacker-supplied
    # XML reaches either path. Recheck when self_update/Tauri bump their pins.
    "RUSTSEC-2026-0194",  # quick-xml: quadratic runtime on duplicate attribute names.
    "RUSTSEC-2026-0195",  # quick-xml: unbounded namespace allocation in NsReader.
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
